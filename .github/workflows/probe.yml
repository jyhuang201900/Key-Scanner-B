name: Probe Search Queries

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/probe.yml"
      - "probe.py"
      - "scanner.py"
      - "line_format.py"

concurrency:
  group: outlook-leak-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    # probe.py has its own 15 min wall-clock deadline and flushes partial
    # results after every query, so the job timeout is a safety net only.
    timeout-minutes: 22
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run probe
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PROBE_DEADLINE: "420"
          PROBE_SAMPLE: "2"
        run: python probe.py

      - name: Add summary
        if: always()
        run: |
          {
            echo "## Query probe"
            echo ""
            if [ -f probe_report.md ]; then
              cat probe_report.md
            else
              echo "probe_report.md was not produced; check job logs."
              [ -f probe_results.json ] && cat probe_results.json
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: query-probe-${{ github.run_number }}
          path: |
            probe_report.md
            probe_results.json
          if-no-files-found: warn
          retention-days: 14
