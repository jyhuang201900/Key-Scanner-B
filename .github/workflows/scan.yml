name: Scan Gemini Keys

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'
      
      - name: Install Dependencies
        run: pip install -r requirements.txt
      
      - name: Run Scanner
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        run: python cli.py both --export-txt
      
      - name: Upload Results
        uses: actions/upload-artifact@v4
        with:
          name: scan-results-${{ github.run_number }}
          path: output/
          retention-days: 30
      
      - name: Summary
        run: |
          echo "## 扫描结果" >> $GITHUB_STEP_SUMMARY
          if [ -f output/found_keys.json ]; then
            echo "✅ 扫描完成" >> $GITHUB_STEP_SUMMARY
            echo "📊 结果已保存到 Artifacts" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ 扫描失败" >> $GITHUB_STEP_SUMMARY
          fi
