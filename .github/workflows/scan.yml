name: Scan Outlook Leak Lines

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Scan
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
        run: python cli.py scan

      - name: Add summary
        if: always()
        run: |
          echo "## Outlook leak scan" >> "$GITHUB_STEP_SUMMARY"
          if [ -f results.txt ]; then
            echo "Saved lines: $(wc -l < results.txt)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No results.txt was produced." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: outlook-results-${{ github.run_number }}
          path: results.txt
          if-no-files-found: warn
          retention-days: 7
