name: Scan Outlook Leak Lines

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/scan.yml"
      - "cli.py"
      - "config.py"
      - "line_format.py"
      - "scanner.py"
      - "storage.py"
      - "requirements.txt"
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

concurrency:
  group: outlook-leak-scan
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore accumulated results
        uses: actions/cache/restore@v4
        with:
          path: results.txt
          key: outlook-results-v2-${{ github.run_id }}
          restore-keys: |
            outlook-results-v2-

      - name: Scan
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python cli.py scan

      - name: Ensure results file
        if: always()
        run: touch results.txt

      - name: Save accumulated results
        if: always()
        uses: actions/cache/save@v4
        with:
          path: results.txt
          key: outlook-results-v2-${{ github.run_id }}

      - name: Add summary
        if: always()
        run: |
          echo "## Outlook leak scan" >> "$GITHUB_STEP_SUMMARY"
          if [ -f results.txt ]; then
            echo "Saved lines: $(wc -l < results.txt)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No results.txt was produced." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f scan_stats.json ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "### Scan stats" >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat scan_stats.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: outlook-results-${{ github.run_number }}
          path: |
            results.txt
            scan_stats.json
          if-no-files-found: warn
          retention-days: 7
